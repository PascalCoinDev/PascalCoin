name: build

on:
  push:
    branches: [ master ]
    tags: [ "*" ]
    paths-ignore: [ "README.md", "CHANGELOG.md", "release-notes.md" ]

  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        operating-system: [windows-latest,ubuntu-latest,macos-15-intel]
#        lazarus-versions: [stable, 2.2.2, 2.2.0, 2.0.12]
        lazarus-versions: [stable]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Lazarus
      uses: gcarreno/setup-lazarus@v3
      with:
        with-cache: false
        lazarus-version: ${{ matrix.lazarus-versions }}

    - name: Test core and framework read/write locks
      shell: bash
      run: |
        mkdir -p .ci-threading/units .ci-threading/bin
        fpc -B -Mdelphi -Sh -gl -Cr -Co \
          -FU.ci-threading/units -FE.ci-threading/bin \
          -Fusrc/core -Fusrc/libraries/sphere10 -Fusrc/libraries/pascalcoin \
          -Fusrc/libraries/generics.collections -Fisrc/libraries/generics.collections/inc \
          -Fusrc/tests/experimental/core -Fusrc/tests/experimental/framework \
          src/tests/experimental/ThreadingTests.lpr
        ./.ci-threading/bin/ThreadingTests .ci-threading/results.log
        cat .ci-threading/results.log
        grep -q '^0 unfreed memory blocks' .ci-threading/results.log.heap.log

    - name: Diagnose Unix threading failures
      if: ${{ failure() && runner.os != 'Windows' }}
      shell: bash
      run: |
        if [[ ! -x .ci-threading/bin/ThreadingTests ]]; then exit 0; fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          gdb --batch -ex 'set pagination off' -ex run -ex 'thread apply all bt 40' \
            --args ./.ci-threading/bin/ThreadingTests .ci-threading/debug-results.log
        else
          lldb --batch -o run -k 'thread backtrace all -c 40' \
            -- ./.ci-threading/bin/ThreadingTests .ci-threading/debug-results.log
        fi

    - name: Upload threading reports
      if: ${{ always() && hashFiles('.ci-threading/*.log*') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: Threading-${{ runner.os }}
        path: .ci-threading/*.log*
        include-hidden-files: true

    - name: Build the Pascal daemon
      run: lazbuild -B "src/pascalcoin_daemon.lpi"

    - name: Build reference Pascal Miner
      run: lazbuild -B "src/pascalcoin_miner.lpi"

    - name: Build Classic Wallet (Windows/Linux)
      if: ${{ runner.os != 'macOS' }}
      run: lazbuild -B "src/pascalcoin_wallet_classic.lpi"

    - name: Build Classic Wallet (macOS)
      if: ${{ runner.os == 'macOS' }}
      run: lazbuild -B --ws=cocoa "src/pascalcoin_wallet_classic.lpi"

    - name: Build Experimental Wallet (Windows/Linux)
      if: ${{ runner.os != 'macOS' }}
      run: lazbuild -B --build-mode=Release "src/pascalcoin_wallet_experimental.lpi"

    - name: Build Experimental Wallet (macOS)
      if: ${{ runner.os == 'macOS' }}
      run: lazbuild -B --ws=cocoa --build-mode=Release "src/pascalcoin_wallet_experimental.lpi"

    - name: Test bounded message dialogs on the default desktop (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $compiler = (Get-Command fpc).Source
        $lazarus = Split-Path -Parent (Get-Command lazbuild).Source
        & .\src\tests\experimental\RunWalletGridRefreshTests.ps1 -Demo -DemoCase operation-messages -FpcPath $compiler -LazarusDirectory $lazarus -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wallet-message-small')
        exit $LASTEXITCODE

    - name: Prepare the 150-percent native test viewport (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        & .\src\tests\experimental\native\SetCiDisplayMode.ps1 -ReportPath (Join-Path $env:RUNNER_TEMP 'wallet-display.json')

    - name: Test wallet units and native workflows (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        & .\src\tests\experimental\RunAllWalletTests.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wallet-tests')
        exit $LASTEXITCODE

    - name: Upload wallet test reports
      if: ${{ always() && runner.os == 'Windows' }}
      uses: actions/upload-artifact@v7
      with:
        name: Wallet-tests-Windows
        if-no-files-found: warn
        retention-days: 14
        path: |
          ${{ runner.temp }}/wallet-tests/**/*.log
          ${{ runner.temp }}/wallet-tests/**/*.json
          ${{ runner.temp }}/wallet-tests/**/*.png
          ${{ runner.temp }}/wallet-tests/**/*.bmp

    - name: Upload native display checks
      if: ${{ always() && runner.os == 'Windows' }}
      uses: actions/upload-artifact@v7
      with:
        name: Native-display-Windows
        if-no-files-found: warn
        retention-days: 14
        path: |
          ${{ runner.temp }}/wallet-display.json
          ${{ runner.temp }}/wallet-message-small/**/*.log
          ${{ runner.temp }}/wallet-message-small/**/*.json
          ${{ runner.temp }}/wallet-message-small/**/*.bmp

    - name: Upload binary (Windows)
      if: ${{ (matrix.operating-system == 'windows-latest')  &&  (matrix.lazarus-versions == 'stable') }}
      uses: actions/upload-artifact@v7
      with:
        name: PascalCoinWindows
        if-no-files-found: error
        path: |
          src/pascalcoin_daemon.exe
          src/PascalCoinMiner.exe
          src/PascalCoinWalletLazarus.exe
          src/PascalCoinWalletExperimental.exe

    - name: Upload binary (Ubuntu)
      if: ${{ (matrix.operating-system == 'ubuntu-latest')  &&  (matrix.lazarus-versions == 'stable') }}
      uses: actions/upload-artifact@v7
      with:
        name: PascalCoinLinux
        if-no-files-found: error
        path: |
          src/pascalcoin_daemon
          src/PascalCoinMiner
          src/PascalCoinWalletLazarus
          src/PascalCoinWalletExperimental

    - name: Upload binary (macOS)
      if: ${{ (runner.os == 'macOS')  &&  (matrix.lazarus-versions == 'stable') }}
      uses: actions/upload-artifact@v7
      with:
        name: PascalCoinMacOS
        if-no-files-found: error
        path: |
          src/pascalcoin_daemon
          src/PascalCoinMiner
          src/PascalCoinWalletLazarus
          src/PascalCoinWalletExperimental

  package-release:
    if: contains(github.ref, '/tags/')

    name: Package and create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> ${GITHUB_OUTPUT}

    - name: Download the Release binary
      uses: actions/download-artifact@v7
      with:
        pattern: PascalCoin*

    - name: List files
      run: |
        ls -alF PascalCoinWindows
        ls -alF PascalCoinLinux
        ls -alF PascalCoinMacOS

    - name: Create release files
      run: |
        for package in PascalCoinWindows PascalCoinLinux PascalCoinMacOS; do
          cp -R src/locale licenses "$package/"
          cp src/pascalsha.cl LICENSE "$package/"
        done
        cd PascalCoinWindows
        cp ../windows-dll/*.dll .
        zip -r PascalCoin-${{ steps.vars.outputs.tag }}-x86_64-win64.zip *.exe *.dll locale licenses pascalsha.cl LICENSE
        cd ../PascalCoinLinux
        cp ../linux-libs/*.so.1.1 .
        chmod +x PascalCoin* pascalcoin*
        tar -zcvf PascalCoin-${{ steps.vars.outputs.tag }}-x86_64-linux.tar.gz PascalCoin* pascalcoin* *.so.1.1 locale licenses pascalsha.cl LICENSE
        cd ../PascalCoinMacOS
        chmod +x PascalCoin* pascalcoin*
        tar -zcvf PascalCoin-${{ steps.vars.outputs.tag }}-x86_64-darwin.tar.gz PascalCoin* pascalcoin* locale licenses pascalsha.cl LICENSE

    - name: Checksum release files
      run: |
        for archive in PascalCoinWindows/*.zip PascalCoinLinux/*.tar.gz PascalCoinMacOS/*.tar.gz; do
          sha256sum "$archive" | sed 's@  .*/@  @'
        done > SHA256SUMS

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        name: PascalCoin ${{ steps.vars.outputs.tag }}
        body_path: release-notes.md
        files: |
          PascalCoinWindows/*.zip
          PascalCoinLinux/*.tar.gz
          PascalCoinMacOS/*.tar.gz
          SHA256SUMS
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

